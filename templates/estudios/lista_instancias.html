{% extends 'base_tailwind.html' %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">Instancias Serie {{ series_id|slice:':16' }}...</h1>
<table class="min-w-full text-sm">
  <thead class="bg-gray-100">
    <tr>
      <th class="px-2 py-1 text-left">ID</th>
      <th class="px-2 py-1 text-left">Acciones</th>
    </tr>
  </thead>
  <tbody>
  {% for inst in instances %}
    <tr class="border-b hover:bg-gray-50">
      <td class="px-2 py-1 font-mono text-xs">{{ inst|slice:':20' }}...</td>
      <td class="px-2 py-1">
        <a class="text-blue-600 hover:underline" href="{% url 'estudios:detalle_instancia' inst %}">Detalle</a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="2" class="px-2 py-4 text-center text-gray-500">Sin instancias</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
