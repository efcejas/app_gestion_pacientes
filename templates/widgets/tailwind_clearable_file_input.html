{% if widget.is_initial %}
  <div class="mb-2">
    <span class="text-xs text-gray-500">Archivo actual:</span>
    <div class="mt-1 flex items-center gap-3">
      {% if widget.value.url %}
        <img src="{{ widget.value.url }}" alt="Firma actual" class="h-12 max-h-12 border rounded bg-white" />
      {% endif %}
      <div class="flex items-center gap-2 text-sm text-gray-600">
        <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
        <label for="{{ widget.checkbox_id }}" class="select-none">{{ widget.clear_checkbox_label }}</label>
      </div>
    </div>
  </div>
{% endif %}
<div>
  <label for="{{ widget.attrs.id|default:'file_input'}}" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Subir firma</label>
  <input
    type="file"
    name="{{ widget.name }}"
    {% include "django/forms/widgets/attrs.html" %}
    aria-label="Seleccionar archivo de firma"
    class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none dark:text-gray-400 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 file:me-4 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700"
  />
</div>
