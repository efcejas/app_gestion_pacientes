{% extends "base_tailwind.html" %}
{% load static %}

{% block title %}Confirmación de Registro{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow text-center">
        <div class="text-white rounded-t-xl py-3 bg-gradient-to-r from-emerald-600 to-green-600">
            <h5 class="m-0 text-base font-semibold">¡Registro exitoso!</h5>
        </div>
        <div class="p-6">
            <p class="text-gray-700 dark:text-gray-200 mb-4">Tu cuenta ha sido creada exitosamente. <br> Ahora puedes iniciar sesión y disfrutar de todas las funcionalidades.</p>
            <a href="{% url 'login' %}" class="inline-flex items-center justify-center rounded-md bg-emerald-600 text-white px-4 py-2.5 text-sm font-medium hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
                Iniciar sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
