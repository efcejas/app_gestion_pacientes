{% extends "base_tailwind.html" %}

{% block title %}Contraseña Cambiada{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow text-center">
        <div class="text-white rounded-t-xl py-3 bg-gradient-to-r from-emerald-600 to-green-600">
            <h5 class="m-0 text-base font-semibold">¡Contraseña actualizada!</h5>
        </div>
        <div class="p-6">
            <p class="mb-3">
                <svg class="mx-auto w-12 h-12 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            </p>
            <p class="text-gray-700 dark:text-gray-200">Tu contraseña fue modificada correctamente.</p>
            <div class="mt-4">
                <a href="{% url 'home' %}" class="inline-flex items-center justify-center rounded-md border border-gray-300 text-gray-700 px-4 py-2.5 text-sm font-medium hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-offset-2">
                    Ir al inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
