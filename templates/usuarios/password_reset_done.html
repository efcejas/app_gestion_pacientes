{% extends "base_tailwind.html" %}

{% block title %}Correo enviado{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow text-center">
        <div class="text-white rounded-t-xl py-3 bg-gradient-to-r from-blue-600 to-indigo-600">
            <h5 class="m-0 text-base font-semibold">Revisa tu correo</h5>
        </div>
        <div class="p-6">
            <p class="mb-3 text-gray-700 dark:text-gray-200">
                Te enviamos un enlace para restablecer tu contraseña.
                <br>
                Revisá tu bandeja de entrada o la carpeta de correo no deseado.
            </p>
            <div class="mt-2">
                <a href="{% url 'login' %}" class="inline-flex items-center justify-center rounded-md bg-blue-600 text-white px-4 py-2.5 text-sm font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Volver al inicio de sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
